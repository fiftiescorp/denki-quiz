<title>現場巡回チェック野帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style id="app-css">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
img{display:block;max-width:100%}

:root{
  --ground:#E9ECEA;
  --grid:rgba(18,69,89,.055);
  --surface:#FBFCFA;
  --surface-2:#F1F4F1;
  --ink:#12181A;
  --ink-2:#5B6771;
  --ink-3:#8B959B;
  --line:#D2DAD6;
  --line-strong:#B7C2BD;
  --accent:#124559;
  --accent-soft:#DCE7EB;
  --accent-ink:#F4F8F7;
  --focus:#1E7FA0;
  --ok:#3F7D3C;      --ok-bg:#E4EEE1;
  --warn:#B07600;    --warn-bg:#F6ECD5;
  --ng:#AF2B26;      --ng-bg:#F6E2E0;
  --skip:#6C7A80;    --skip-bg:#E7EBEA;
  --na:#8B959B;      --na-bg:#EDF0EE;
  --tag-on:#FFFFFF;
  --shadow:0 1px 0 rgba(18,24,26,.05), 0 2px 10px rgba(18,24,26,.05);
  --radius:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1417;
    --grid:rgba(140,196,214,.05);
    --surface:#161D21;
    --surface-2:#1C2429;
    --ink:#E4EAE8;
    --ink-2:#9BAAB0;
    --ink-3:#74848B;
    --line:#263136;
    --line-strong:#374549;
    --accent:#6FB9CE;
    --accent-soft:#1B2E36;
    --accent-ink:#0B1114;
    --focus:#7FCBE0;
    --ok:#7FC17A;      --ok-bg:#1B2A1E;
    --warn:#E0AF4A;    --warn-bg:#2C2413;
    --ng:#E88079;      --ng-bg:#2E1B1A;
    --skip:#93A2A8;    --skip-bg:#212A2E;
    --na:#74848B;      --na-bg:#1D2528;
    --tag-on:#0B1114;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1417;
  --grid:rgba(140,196,214,.05);
  --surface:#161D21;
  --surface-2:#1C2429;
  --ink:#E4EAE8;
  --ink-2:#9BAAB0;
  --ink-3:#74848B;
  --line:#263136;
  --line-strong:#374549;
  --accent:#6FB9CE;
  --accent-soft:#1B2E36;
  --accent-ink:#0B1114;
  --focus:#7FCBE0;
  --ok:#7FC17A;      --ok-bg:#1B2A1E;
  --warn:#E0AF4A;    --warn-bg:#2C2413;
  --ng:#E88079;      --ng-bg:#2E1B1A;
  --skip:#93A2A8;    --skip-bg:#212A2E;
  --na:#74848B;      --na-bg:#1D2528;
  --tag-on:#0B1114;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.28);
}

body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;
  color:var(--ink);
  background-color:var(--ground);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  -webkit-text-size-adjust:100%;
  line-height:1.6;
  padding-bottom:96px;
}
.mono{font-family:"DM Mono","SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
.ud{font-family:"BIZ UDPGothic","Zen Kaku Gothic New",Meiryo,sans-serif}

:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* ---------- 帳票ヘッダ ---------- */
.sheet{
  background:var(--surface);
  border:1px solid var(--line);
  border-top:3px solid var(--accent);
  box-shadow:var(--shadow);
  margin:14px 0;
}
.sheet-top{
  display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 18px;
  padding:12px 14px 10px;
}
.sheet-id{flex:1 1 240px;min-width:0}
.eyebrow{
  font-size:11px;letter-spacing:.18em;color:var(--ink-3);
  text-transform:none;margin:0 0 2px;
}
.site-name{
  font-family:"BIZ UDPGothic","Zen Kaku Gothic New",Meiryo,sans-serif;
  font-weight:700;font-size:clamp(19px,4.4vw,25px);line-height:1.25;
  margin:0;text-wrap:balance;
  border:1px dashed transparent;border-radius:2px;padding:1px 3px;margin-left:-3px;
  width:100%;background:none;text-align:left;
}
.site-name:hover{border-color:var(--line-strong)}
.who{
  display:flex;align-items:center;gap:7px;flex:0 0 auto;
}
.who-chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:999px;
  padding:4px 11px 4px 6px;font-size:13px;background:var(--surface-2);
}
.avatar{
  width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);
  font-size:11px;font-weight:700;letter-spacing:0;
}
.avatar.b{background:var(--warn)}

/* 帳票メタ行 */
.meta-row{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--line);
}
input[type="date"].meta-v{font-size:13px;letter-spacing:-.01em}
.sheet-foot{
  border-top:1px dotted var(--line);padding:5px 14px 7px;
  font-size:11.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;
}
.meta-cell{
  padding:7px 12px 8px;border-right:1px solid var(--line);min-width:0;
}
.meta-cell:last-child{border-right:none}
.meta-k{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);display:block}
.meta-v{
  font-size:15px;font-weight:500;background:none;border:1px dashed transparent;
  border-radius:2px;width:100%;padding:0 2px;margin-left:-2px;
}
.meta-v:hover{border-color:var(--line-strong)}
select.meta-v{
  appearance:none;cursor:pointer;padding-right:18px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 9px) calc(50% + 1px), calc(100% - 5px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
input.meta-v{min-width:0}

/* ---------- 集計バー ---------- */
.ledger{border-top:1px solid var(--line);padding:11px 14px 13px}
.bar{
  display:flex;height:9px;border-radius:1px;overflow:hidden;
  background:var(--na-bg);border:1px solid var(--line);
}
.bar span{display:block;transition:width .28s ease}
.bar .s-ok{background:var(--ok)} .bar .s-warn{background:var(--warn)}
.bar .s-ng{background:var(--ng)} .bar .s-skip{background:var(--skip)}
.counts{
  display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:9px;align-items:baseline;
}
.count{display:inline-flex;align-items:baseline;gap:5px;font-size:12.5px;color:var(--ink-2)}
.count b{font-size:17px;font-weight:500;color:var(--ink)}
.count i{width:9px;height:9px;border-radius:1px;display:inline-block;transform:translateY(0)}
.count.ok i{background:var(--ok)} .count.warn i{background:var(--warn)}
.count.ng i{background:var(--ng)} .count.skip i{background:var(--skip)}
.count.na i{background:var(--na)}
.count.done{margin-left:auto;color:var(--ink-2)}

/* ---------- フィルタ ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.filters button{
  white-space:nowrap;border:1px solid var(--line);background:var(--surface);
  padding:6px 13px;border-radius:999px;font-size:13px;color:var(--ink-2);
}
.filters button[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500;
}

/* ---------- レイアウト ---------- */
.cols{display:block}
.rail{display:none}
@media (min-width:1000px){
  .cols{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
  .rail{display:block;position:sticky;top:14px}
}
.rail h2{font-size:11px;letter-spacing:.16em;color:var(--ink-3);margin:0 0 8px;font-weight:400}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.rail a{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:6px 9px;font-size:13px;text-decoration:none;color:var(--ink-2);
  border-left:2px solid var(--line);
}
.rail a:hover{background:var(--surface);color:var(--ink);border-left-color:var(--accent)}
.rail .pend{font-size:11.5px;color:var(--ink-3)}
.rail .pend.alert{color:var(--ng);font-weight:700}

/* ---------- 分類 ---------- */
.cat{margin:0 0 22px;scroll-margin-top:14px;max-width:900px}
.cat-head{
  display:flex;align-items:baseline;gap:10px;
  padding:0 0 7px;border-bottom:2px solid var(--accent);margin-bottom:10px;
}
.cat-head h3{
  font-family:"BIZ UDPGothic","Zen Kaku Gothic New",Meiryo,sans-serif;
  font-weight:700;font-size:15px;margin:0;letter-spacing:.02em;
}
.cat-head .n{font-size:12px;color:var(--ink-3)}

/* ---------- 点検カード ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--na);
  margin-bottom:8px;box-shadow:var(--shadow);
}
.card[data-status="ok"]{border-left-color:var(--ok)}
.card[data-status="warn"]{border-left-color:var(--warn)}
.card[data-status="ng"]{border-left-color:var(--ng)}
.card[data-status="skip"]{border-left-color:var(--skip);opacity:.72}
.card-head{display:flex;gap:10px;align-items:flex-start;padding:10px 12px 8px}
.card-label{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.45;font-weight:500}
.card-no{
  font-size:11px;color:var(--ink-3);flex:0 0 auto;padding-top:3px;
}
.card-del{flex:0 0 auto;color:var(--ink-3);font-size:12px;padding:2px 4px}
.card-del:hover{color:var(--ng)}

/* 点検札 */
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 9px}
.tagwrap{display:inline-block;line-height:0}
.tagwrap:has(> button:focus-visible){outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.tag{
  --c:var(--ink-2); --bg:var(--surface-2);
  position:relative;display:inline-block;
  padding:6px 13px 6px 20px;font-size:13px;font-weight:500;line-height:1.25;
  color:var(--c);background:var(--bg);
  border:0;
  clip-path:polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%);
  box-shadow:inset 0 0 0 1px var(--line);
}
.tag::before{
  content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.42;
}
.tag:hover{--bg:var(--accent-soft)}
.tag[aria-pressed="true"]{box-shadow:none;font-weight:700}
.tag[data-s="ok"][aria-pressed="true"]{--bg:var(--ok);--c:var(--tag-on)}
.tag[data-s="warn"][aria-pressed="true"]{--bg:var(--warn);--c:var(--tag-on)}
.tag[data-s="ng"][aria-pressed="true"]{--bg:var(--ng);--c:var(--tag-on)}
.tag[data-s="skip"][aria-pressed="true"]{--bg:var(--skip);--c:var(--tag-on)}

/* 入力域 */
.entry{padding:0 12px 10px;display:flex;flex-direction:column;gap:8px}
.measure{display:flex;align-items:center;gap:7px}
.measure label{font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.measure input{
  width:110px;padding:5px 8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);
  font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;
}
.measure .unit{font-size:13px;color:var(--ink-2)}
.memo{
  width:100%;min-height:0;height:34px;resize:none;overflow:hidden;
  padding:6px 9px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:13.5px;line-height:1.5;
}
.memo::placeholder{color:var(--ink-3)}
.memo:focus{background:var(--surface)}

/* 写真 */
.shots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.shot{
  position:relative;width:62px;height:62px;border:1px solid var(--line);
  border-radius:2px;overflow:hidden;background:var(--surface-2);padding:0;
}
.shot img{width:100%;height:100%;object-fit:cover}
.addshot{
  width:62px;height:62px;border:1px dashed var(--line-strong);border-radius:2px;
  display:grid;place-items:center;gap:1px;color:var(--ink-2);
  font-size:10.5px;background:var(--surface-2);
}
.addshot svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5}
.addshot:hover{border-color:var(--accent);color:var(--accent)}
.card-foot{
  border-top:1px dotted var(--line);padding:5px 12px 7px;
  font-size:11.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;
}

/* ---------- 追加項目 ---------- */
.addrow{display:flex;gap:6px;margin:2px 0 0}
.addrow input{
  flex:1 1 auto;min-width:0;padding:7px 10px;background:var(--surface);
  border:1px dashed var(--line-strong);border-radius:var(--radius);font-size:13.5px;
}
.addrow button{
  flex:0 0 auto;padding:7px 14px;border:1px solid var(--accent);color:var(--accent);
  border-radius:var(--radius);font-size:13px;font-weight:500;background:var(--surface);
}
.addrow button:hover{background:var(--accent);color:var(--accent-ink)}

/* ---------- 下部アクションバー ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line-strong);
  box-shadow:0 -2px 14px rgba(18,24,26,.09);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
}
.dock-in{
  max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.dock-acts{display:contents}
@media (max-width:640px){
  .dock-in{display:grid;grid-template-columns:1fr auto;grid-template-areas:"sync gauge" "acts acts";gap:7px 10px}
  .sync{grid-area:sync}
  .gauge{grid-area:gauge}
  .dock-acts{grid-area:acts;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .dock-acts .btn{padding:9px 4px;text-align:center;font-size:12.5px}
}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);flex:1 1 190px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.dot.pending{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.dot.error{background:var(--ng)}
.dot.local{background:var(--skip)}
@keyframes pulse{50%{opacity:.32}}
.sync .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{
  padding:8px 14px;border:1px solid var(--line-strong);border-radius:var(--radius);
  font-size:13px;font-weight:500;background:var(--surface);color:var(--ink);
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.88;color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- 容量計 ---------- */
.gauge{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.gauge .track{width:64px;height:5px;background:var(--na-bg);border:1px solid var(--line);border-radius:1px;overflow:hidden}
.gauge .fill{height:100%;background:var(--accent);transition:width .3s ease}
.gauge.warn .fill{background:var(--warn)} .gauge.full .fill{background:var(--ng)}

/* ---------- モーダル ---------- */
dialog{
  border:1px solid var(--line-strong);border-radius:var(--radius);padding:0;
  background:var(--surface);color:var(--ink);
  max-width:min(680px,94vw);width:100%;box-shadow:0 18px 60px rgba(0,0,0,.3);
}
dialog::backdrop{background:rgba(9,16,18,.62)}
.dlg-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);
}
.dlg-head h3{margin:0;font-size:15px;font-family:"BIZ UDPGothic",sans-serif;font-weight:700}
.dlg-body{padding:14px 16px;max-height:min(66vh,560px);overflow:auto}
.dlg-foot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{font-size:20px;line-height:1;color:var(--ink-3);padding:2px 6px}
.x:hover{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:11.5px;letter-spacing:.12em;color:var(--ink-3)}
.field input,.field textarea,.field select{
  padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);font-size:14px;
}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.65;margin:0 0 12px}
.hint code{font-family:"DM Mono",monospace;font-size:12px}

/* 履歴 */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{border:1px solid var(--line);border-left:3px solid var(--accent);padding:9px 11px;background:var(--surface-2)}
.hist .hl{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.hist .hd{font-family:"DM Mono",monospace;font-size:14px;font-variant-numeric:tabular-nums}
.hist .hs{font-size:12px;color:var(--ink-2);display:flex;gap:9px;flex-wrap:wrap}
.hist .acts{display:flex;gap:6px;margin-top:7px}
.hist .acts button{font-size:12px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:var(--radius)}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:26px 0}

/* 写真ビューア */
#viewer{max-width:min(940px,96vw);background:#0C1113;border-color:#0C1113}
#viewer .dlg-head{border-color:#243035;color:#E4EAE8}
#viewer .dlg-head h3{color:#E4EAE8}
#viewer .dlg-body{padding:0;background:#0C1113;display:grid;place-items:center;max-height:72vh}
#viewer img{max-height:72vh;width:auto;object-fit:contain}
#viewer .dlg-foot{border-color:#243035;background:#0C1113}
#viewer .x{color:#8B959B}

/* トースト */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;z-index:60;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{
  background:var(--ink);color:var(--ground);padding:8px 15px;border-radius:999px;
  font-size:13px;box-shadow:0 6px 22px rgba(0,0,0,.3);
  animation:rise .22s ease both;
}
.toast.bad{background:var(--ng);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(7px)}}

/* 閲覧のみ帯 */
.readonly-bar{
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--ink);
  padding:8px 12px;font-size:13px;margin:14px 0 0;border-radius:var(--radius);
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

  /* ============ 小道具 ============ */
  function $(sel, root) { return (root || document).querySelector(sel); }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function store(key, val) {
    try {
      if (val === undefined) { var r = localStorage.getItem(key); return r == null ? null : JSON.parse(r); }
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }
  function sess(key, val) {
    try {
      if (val === undefined) { var r = sessionStorage.getItem(key); return r == null ? null : JSON.parse(r); }
      if (val === null) { sessionStorage.removeItem(key); return; }
      sessionStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmtDate(iso) {
    if (!iso) return "—";
    var p = String(iso).split("-");
    return p.length === 3 ? p[0] + "/" + p[1] + "/" + p[2] : iso;
  }
  function fmtClock(ms) {
    if (!ms) return "";
    var d = new Date(ms);
    return pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function bytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }
  function uid(p) { return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function allItems() { return MASTER.concat(S.round.extra || []); }
  /** 書き込み用：無ければ作る */
  function entry(id) {
    var e = S.round.entries[id];
    if (!e) { e = { status: "na", value: "", memo: "", photos: [] }; S.round.entries[id] = e; }
    if (!e.photos) e.photos = [];
    return e;
  }
  /** 読み取り用：無い項目で記録を増やさない */
  function peek(id) {
    var e = S.round.entries[id];
    if (!e) return { status: "na", value: "", memo: "", photos: [] };
    if (!e.photos) e.photos = [];
    return e;
  }
  /** 何も記入されていない項目を落として容量を抑える */
  function prune() {
    var en = S.round.entries;
    Object.keys(en).forEach(function (k) {
      var e = en[k];
      if ((!e.status || e.status === "na") && !e.memo && !e.value && !(e.photos || []).length) delete en[k];
    });
  }
  function summary(round) {
    var c = { ok: 0, warn: 0, ng: 0, skip: 0, na: 0, photos: 0, total: 0 };
    var items = MASTER.concat(round.extra || []);
    items.forEach(function (it) {
      var e = (round.entries || {})[it.id] || { status: "na", photos: [] };
      c[e.status || "na"] = (c[e.status || "na"] || 0) + 1;
      c.photos += (e.photos || []).length;
      c.total++;
    });
    return c;
  }
  function stateBytes() {

  function markDirty() {
    dirty = true;
    setSync("pending", "未保存の変更");
    updateGauge();
    if (publishTimer) clearTimeout(publishTimer);
    publishTimer = setTimeout(commit, PUBLISH_DELAY);
  }

  function stashDrafts() {
    sess(SS_SCROLL, window.scrollY);
  }

  function saveLocal() {
    store(LS_LOCAL, { at: Date.now(), state: S });
  }

  /** 文字入力中は保存を待つ。保存は全ての表示を最新版へ再読み込みさせるため。 */
  function typing() {
    var a = document.activeElement;
    return !!(a && a.matches && a.matches("#app input, #app textarea, #app select"));
  }

  function commit() {
    if (publishTimer) { clearTimeout(publishTimer); publishTimer = null; }
    if (!dirty || publishing) return;
    if (!probed) { publishTimer = setTimeout(commit, 700); return; }
    if (typing()) { publishTimer = setTimeout(commit, 1200); return; }

    prune();
    S.updatedAt = Date.now();
    S.updatedBy = ME ? ME.name : "";

    if (stateBytes() > MAX_BYTES) {
      setSync("error", "容量上限を超えています");
      toast("記録が上限(" + bytes(MAX_BYTES) + ")を超えました。写真を減らしてください。", true);
      return;
    }

    saveLocal();

    if (!canPublish) {
      dirty = false;
      setSync("local", readOnly ? "閲覧のみ（この端末に控えを保存）" : "この端末にのみ保存");
      return;
    }

    publishing = true;
    setSync("pending", "共有に保存中…");
    stashDrafts();

    artifactApi.publish(renderDocument(S)).then(function () {
      // 保存成功後、この表示は最新版へ再読み込みされる
      dirty = false;
      publishing = false;
      sess(SS_DRAFT, null);
      setSync("ok", "共有に保存しました");
    }).catch(function (err) {
      publishing = false;
      var code = (err && err.code) || "upstream_error";
      if (code === "conflict") {
        // 相手の保存が先に反映済み。この表示は最新版へ再読み込みされる
        setSync("pending", "相手の更新を反映しています…");
        return;
      }
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
          code === "consent_required" || code === "capability_disabled" || code === "capability_removed") {
        enterReadOnly();
        return;
      }
      if (code === "too_large") {
        setSync("error", "容量オーバー");
        toast("記録が大きすぎて保存できません。写真を削除してください。", true);
        return;
      }
      if (code === "rate_limited") {
        setSync("pending", "保存を待機中…");
        publishTimer = setTimeout(commit, 6000);
        return;
      }
      setSync("error", "保存に失敗しました");
      toast("共有への保存に失敗しました。変更はこの端末に残っています。", true);
    });
  }

  /* ============ 画像圧縮 ============ */
  function compress(file) {
    return new Promise(function (resolve, reject) {
      var opts = { imageOrientation: "from-image" };
      var p = window.createImageBitmap
        ? createImageBitmap(file, opts).catch(function () { return createImageBitmap(file); })
        : Promise.reject(new Error("no bitmap"));

      p.then(function (bmp) { resolve(encode(bmp, bmp.width, bmp.height)); })
        .catch(function () {
          var img = new Image();
          var url = URL.createObjectURL(file);
          img.onload = function () {
            try { resolve(encode(img, img.naturalWidth, img.naturalHeight)); }
            catch (e) { reject(e); }
            URL.revokeObjectURL(url);
          };
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode")); };
          img.src = url;
        });

      function encode(src, w, h) {
        function draw(maxEdge, q) {
          var scale = Math.min(1, maxEdge / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var cv = document.createElement("canvas");
          cv.width = cw; cv.height = ch;
          var ctx = cv.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(src, 0, 0, cw, ch);
          return cv.toDataURL("image/jpeg", q);
        }
        var out = draw(1400, 0.62);
        if (out.length > 340 * 1024) out = draw(1100, 0.5);
        if (out.length > 340 * 1024) out = draw(900, 0.42);
        return out;
      }
    });
  }

  function addPhotos(itemId, files) {
    if (readOnly) return;

    var e = entry(itemId);
    toast(list.length > 1 ? list.length + "枚を取り込んでいます…" : "写真を取り込んでいます…");
    var chain = Promise.resolve();
    list.forEach(function (f) {
      chain = chain.then(function () {
        return compress(f).then(function (src) {
          if (stateBytes() + src.length > MAX_BYTES) {
            toast("容量上限のため、これ以上の写真は追加できません。", true);
            throw new Error("full");

          e.photos.push({ id: uid("p"), src: src, by: ME ? ME.name : "", at: Date.now() });

  function renderList() {
    var out = "";
    var shown = 0;
    CATS.forEach(function (cat) {
      var items = allItems().filter(function (i) { return i.c === cat.id; });
      var vis = items.filter(passesFilter);
      if (!vis.length && filter !== "all") return;
      shown += vis.length;
      out += '<section class="cat" id="cat-' + cat.id + '">';
      out += '<div class="cat-head"><h3>' + esc(cat.name) + '</h3><span class="n mono">' +
        vis.length + (filter === "all" ? "" : "/" + items.length) + '項目</span></div>';
      vis.forEach(function (it, idx) { out += cardHTML(it, idx + 1); });
      if (filter === "all" && !readOnly) {
        out += '<div class="addrow"><input type="text" data-addcat="' + cat.id + '" placeholder="' + esc(cat.name) + 'に項目を追加" aria-label="' + esc(cat.name) + 'に項目を追加"><button data-addbtn="' + cat.id + '">追加</button></div>';
      }
      out += '</section>';
    });
    if (!shown) out = '<p class="empty">該当する点検項目はありません。</p>';
    return out;
  }

  function footText(id) {
    var e = peek(id);
    var bits = [];
    bits.push("判定：" + (STATUS_LABEL[e.status] || "未点検"));
    if (e.by) bits.push("記録：" + e.by);
    if (e.at) bits.push(fmtClock(e.at));

    return bits.map(function (b) { return '<span>' + esc(b) + '</span>'; }).join("");

  function syncCard(id) {
    var card = $('.card[data-id="' + id + '"]');
    if (!card) return;
    var e = peek(id);
    card.dataset.status = e.status || "na";
    $$(".tag", card).forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.s === e.status)); });
    var shots = $('[data-shots="' + id + '"]', card);
    if (shots) shots.innerHTML = shotsHTML(id);
    var foot = $('[data-foot="' + id + '"]', card);
    if (foot) foot.innerHTML = footText(id);
    refreshLedger();

  function refreshLedger() {
    var c = summary(S.round);
    var bar = $(".bar");
    if (bar) {
      ["ok", "warn", "ng", "skip"].forEach(function (k) {
        var el = $(".s-" + k, bar);
        if (el) el.style.width = (c.total ? (c[k] / c.total) * 100 : 0) + "%";
      });
    }
    var box = $(".counts");
    if (box) {
      box.innerHTML = cnt("ok", "良", c.ok) + cnt("warn", "注意", c.warn) + cnt("ng", "不良", c.ng) +
        cnt("skip", "対象外", c.skip) + cnt("na", "未点検", c.na) +
        '<span class="count done">進捗 <b class="mono">' + (c.total - c.na) + "/" + c.total + '</b> ・ 写真 <b class="mono">' + c.photos + '</b>枚</span>';

  /** confirm() の代わり。埋め込み表示でも確実に出せる確認ダイアログ。 */
  function ask(msg, okLabel) {
    var d = $("#askDlg");
    if (!d || !d.showModal) { try { return Promise.resolve(window.confirm(msg)); } catch (e) { return Promise.resolve(false); } }
    $("#askMsg").textContent = msg;
    $("#askYes").textContent = okLabel || "実行";
    return new Promise(function (resolve) {
      d.addEventListener("close", function handler() {
        d.removeEventListener("close", handler);
        resolve(d.returnValue === "yes");
      });
      d.showModal();
    });
  }

  function reportCSV(round) {
    var items = MASTER.concat(round.extra || []);
    var rows = [["分類", "点検項目", "判定", "測定値", "単位", "所見・処置", "写真枚数", "記録者", "記録時刻"]];
    CATS.forEach(function (cat) {
      items.filter(function (i) { return i.c === cat.id; }).forEach(function (it) {
        var e = (round.entries || {})[it.id] || { status: "na", photos: [] };
        rows.push([cat.name, it.t, STATUS_LABEL[e.status] || "未点検", e.value || "", it.u || "",
          (e.memo || "").replace(/\r?\n/g, " "), String((e.photos || []).length), e.by || "", e.at ? fmtClock(e.at) : ""]);
      });
    });
    var csv = rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
    return "﻿" + csv;
  }

  function safeName(s) {
    return String(s).replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 40);
  }

  function download(filename, data, fallbackName, fallbackData) {
    if (!downloadsApi) {
      toast("この画面ではファイルの書き出しが使えません。", true);
      return;
    }
    downloadsApi.save({ filename: filename, data: data }).then(function () {
      toast("書き出しました。");
    }).catch(function (err) {
      var code = (err && err.code) || "unavailable";
      if (code === "declined") return;
      if (code === "extension_not_enabled" && fallbackName) {
        downloadsApi.save({ filename: fallbackName, data: fallbackData }).then(function () {
          toast("この端末ではHTMLを保存できないため、テキスト形式で書き出しました。");
        }).catch(function () { toast("書き出せませんでした。", true); });
        return;
      }
      if (code === "too_large") { toast("ファイルが大きすぎます。写真の少ない巡回を選んでください。", true); return; }
      if (code === "rate_limited") { toast("少し待ってからもう一度お試しください。", true); return; }
      toast("書き出せませんでした。", true);
    });
  }

  /* ============ 巡回の確定 ============ */
  function finishRound() {
    var c = summary(S.round);
    var gate = c.na > 0
      ? ask("未点検が " + c.na + " 項目あります。このまま巡回を確定しますか?", "確定する")
      : Promise.resolve(true);
    gate.then(function (yes) {
      if (!yes) return;
      prune();
      var snap = JSON.parse(JSON.stringify(S.round));
      S.history.push(snap);
      if (S.history.length > 24) S.history.shift();
      S.round = {
        id: uid("r"), date: todayISO(), weather: snap.weather, temp: "", note: "",
        entries: {}, extra: (snap.extra || []).map(function (x) { return JSON.parse(JSON.stringify(x)); })
      };
      filter = "all";
      markDirty();
      render();
      toast("巡回を確定し、新しい野帳を開きました。");
    });
  }

  /* ============ イベント ============ */

  /** 描画のたびに張り直すもの（要素が作り直されるため） */
  function bind() {
    $$(".memo").forEach(autosize);

    var whoDlg = $("#whoDlg");
    whoDlg.addEventListener("close", function () {
      if (whoDlg.returnValue !== "save") return;
      var name = ($("#whoName").value || "").trim().slice(0, 16);
      if (!name) return;
      setMe(name);
      render();
    });

    var siteDlg = $("#siteDlg");
    siteDlg.addEventListener("close", function () {
      if (siteDlg.returnValue !== "save" || readOnly) return;
      S.site.name = ($("#siteN").value || "").trim() || "名称未設定の現場";
      S.site.address = ($("#siteA").value || "").trim();
      S.site.client = ($("#siteC").value || "").trim();
      S.round.note = $("#roundN").value || "";
      markDirty();
      render();
    });
  }

  /** #app 自体は作り直されないので、委譲リスナーは一度だけ張る */
  function bindOnce() {
    var app = $("#app");

    app.addEventListener("click", function (ev) {
      var t = ev.target;

      var closeBtn = t.closest("[data-close]");
      if (closeBtn) { closeDlg(closeBtn.dataset.close); return; }

      var fb = t.closest("[data-filter]");
      if (fb) {
        filter = fb.dataset.filter;
        $$("[data-filter]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.filter === filter)); });
        $("#list").innerHTML = renderList();
        $$(".memo").forEach(autosize);
        return;
      }

      var setBtn = t.closest("[data-set]");
      if (setBtn && !readOnly) {
        var id = setBtn.dataset.set, k = setBtn.dataset.s;
        var e = entry(id);
        e.status = e.status === k ? "na" : k;
        e.by = ME ? ME.name : "";
        e.at = Date.now();
        syncCard(id);
        markDirty();
        return;
      }

      var addBtn = t.closest("[data-add]");
      if (addBtn) {
        var fid = addBtn.dataset.add;
        var inp = document.createElement("input");
        inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
        inp.setAttribute("capture", "environment");
        inp.addEventListener("change", function () { addPhotos(fid, inp.files); });
        inp.click();
        return;
      }

      var viewBtn = t.closest("[data-view]");
      if (viewBtn) {
        viewerPhoto = { id: viewBtn.dataset.view, i: Number(viewBtn.dataset.i) };
        var p = peek(viewerPhoto.id).photos[viewerPhoto.i];
        if (!p) return;
        $("#viewerImg").src = p.src;
        var it = allItems().filter(function (x) { return x.id === viewerPhoto.id; })[0];
        $("#viewerCap").textContent = (it ? it.t : "写真") + "　" + (p.by ? p.by + " " : "") + fmtClock(p.at);
        $("#viewerDel").style.display = readOnly ? "none" : "";
        openDlg("viewer");
        return;
      }

      var delItem = t.closest("[data-del]");
      if (delItem && !readOnly) {
        var did = delItem.dataset.del;
        ask("この点検項目を削除しますか?", "削除する").then(function (yes) {
          if (!yes) return;
          S.round.extra = (S.round.extra || []).filter(function (x) { return x.id !== did; });
          delete S.round.entries[did];
          markDirty();
          render();
        });
        return;
      }

      var addItemBtn = t.closest("[data-addbtn]");
      if (addItemBtn && !readOnly) {
        var cat = addItemBtn.dataset.addbtn;
        var field = $('[data-addcat="' + cat + '"]');
        var label = (field.value || "").trim();
        if (!label) { field.focus(); return; }
        S.round.extra.push({ id: uid("c"), c: cat, t: label, custom: true });
        field.value = "";
        markDirty();
        render();
        toast("項目を追加しました。");
        return;
      }

      if (t.closest("#btnWho")) { $("#whoName").value = ME ? ME.name : ""; openDlg("whoDlg"); return; }
      if (t.closest("#siteName")) {
        $("#siteN").value = S.site.name; $("#siteA").value = S.site.address || "";
        $("#siteC").value = S.site.client || ""; $("#roundN").value = S.round.note || "";
        openDlg("siteDlg"); return;
      }
      if (t.closest("#btnHistory")) { openHistory(); return; }
      if (t.closest("#btnExport")) { openExport(); return; }
      if (t.closest("#btnFinish")) { finishRound(); return; }
      if (t.closest("#btnSaveNow")) { commit(); return; }

      var hexp = t.closest("[data-hexp]");
      if (hexp) { closeDlg("histDlg"); openExport(); $("#expTarget").value = hexp.dataset.hexp; return; }

      var hdel = t.closest("[data-hdel]");
      if (hdel && !readOnly) {
        var hid = hdel.dataset.hdel;
        closeDlg("histDlg");
        ask("この履歴を削除しますか? 記録された写真も一緒に消えます。", "削除する").then(function (yes) {
          if (yes) {
            S.history = S.history.filter(function (r) { return r.id !== hid; });
            markDirty();
          }
          openHistory();
        });
        return;
      }

      if (t.closest("#viewerDel") && viewerPhoto && !readOnly) {
        var pe = entry(viewerPhoto.id);
        pe.photos.splice(viewerPhoto.i, 1);
        syncCard(viewerPhoto.id);
        updateGauge();
        markDirty();
        closeDlg("viewer");
        viewerPhoto = null;
        return;
      }

      if (t.closest("#expHtml")) {
        var r1 = roundById($("#expTarget").value);
        var base = safeName(S.site.name) + "_巡回_" + (r1.date || "");
        download(base + ".html", reportHTML(r1), base + ".md", reportText(r1));
        closeDlg("expDlg");
        return;
      }
      if (t.closest("#expCsv")) {
        var r2 = roundById($("#expTarget").value);
        var b2 = safeName(S.site.name) + "_巡回_" + (r2.date || "");
        download(b2 + ".csv", reportCSV(r2), b2 + ".txt", reportCSV(r2));
        closeDlg("expDlg");
        return;
      }
    });

    app.addEventListener("input", function (ev) {
      var t = ev.target;
      if (readOnly) return;

      if (t.matches("[data-memo]")) {
        var e = entry(t.dataset.memo);
        e.memo = t.value;
        e.by = ME ? ME.name : e.by;
        autosize(t);
        stashDraft(t.dataset.memo, "memo", t.value);
        markDirty();
        return;
      }
      if (t.matches("[data-val]")) {
        var e2 = entry(t.dataset.val);
        e2.value = t.value;
        e2.by = ME ? ME.name : e2.by;
        stashDraft(t.dataset.val, "value", t.value);
        markDirty();
        return;
      }
      if (t.id === "fTemp") { S.round.temp = t.value; markDirty(); return; }
    });

    app.addEventListener("change", function (ev) {
      var t = ev.target;
      if (readOnly) return;
      if (t.id === "fDate") { S.round.date = t.value; markDirty(); return; }
      if (t.id === "fWeather") { S.round.weather = t.value; markDirty(); return; }
    });

    // 入力欄から離れたら保存に進む（入力中は保存＝全表示の再読み込みを避けるため待つ）
    app.addEventListener("blur", function (ev) {
      var t = ev.target;
      if (!t.matches || !t.matches("input, textarea, select")) return;
      var id = t.dataset.memo || t.dataset.val;
      if (id) {
        var foot = $('[data-foot="' + id + '"]');
        if (foot) foot.innerHTML = footText(id);
      }
      if (dirty) {
        if (publishTimer) clearTimeout(publishTimer);
        publishTimer = setTimeout(commit, 600);
      }
    }, true);
  }

  function stashDraft(id, key, val) {
    var d = sess(SS_DRAFT) || {};
    if (!d[id]) d[id] = {};
    d[id][key] = val;
    sess(SS_DRAFT, d);
  }

  function applyDrafts() {
    var d = sess(SS_DRAFT);
    if (!d) return false;
    var changed = false;
    Object.keys(d).forEach(function (id) {
      var e = entry(id);
      if (d[id].memo != null && d[id].memo !== e.memo) { e.memo = d[id].memo; changed = true; }
      if (d[id].value != null && d[id].value !== e.value) { e.value = d[id].value; changed = true; }
    });
    return changed;
  }

  function setMe(name) {
    var found = null;
    S.members.forEach(function (m) { if (m.name === name) found = m; });
    if (!found) {
      found = { id: uid("m"), name: name };
      if (S.members.length < 4) { S.members.push(found); markDirty(); }
    }
    ME = found;
    store(LS_ME, ME);
  }

  function promptName() {
    if (ME || readOnly) return;
    var f = $("#whoName");
    if (!f) return;
    f.value = "";
    openDlg("whoDlg");
  }

  /* ============ 起動 ============ */
  function boot() {
    S = loadState();
    ME = store(LS_ME) || null;

    bindOnce();
    render();

    // 直前の下書きを復元
    if (applyDrafts()) {
      render();
      toast("入力中だった内容を復元しました。");
      markDirty();
    }

    // スクロール位置の復元
    var y = sess(SS_SCROLL);
    if (y != null) { window.scrollTo(0, y); sess(SS_SCROLL, null); }

    // 相手の更新の告知
    var seen = sess(SS_SEEN);
    if (S.updatedAt && seen && S.updatedAt > seen && (!ME || S.updatedBy !== ME.name)) {
      toast((S.updatedBy || "もう一人") + "さんの記録を反映しました。");
    }
    sess(SS_SEEN, S.updatedAt || 0);

    if (!window.claude || !window.claude.use) {
      // 共有の外（プレビューやファイル直開き）— この端末だけで動かす
      probed = true; localOnly = true;
      var cached = store(LS_LOCAL);
      if (cached && cached.state && cached.at > (S.updatedAt || 0)) { S = cached.state; render(); }
      setSync("local", "この端末にのみ保存");
      promptName();
      return;
    }

    window.claude.use("artifact").then(function (api) {
      probed = true;
      artifactApi = api;
      if (!api) { enterReadOnly(); return; }
      canPublish = true;
      setSync(dirty ? "pending" : "ok", dirty ? "未保存の変更" : "共有と同期済み");
      promptName();
      if (dirty) commit();
    }).catch(function () { probed = true; enterReadOnly(); });

    window.claude.use("downloads").then(function (api) { downloadsApi = api; }).catch(function () {});

    window.addEventListener("beforeunload", function () {
      if (dirty) { saveLocal(); stashDrafts(); }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
