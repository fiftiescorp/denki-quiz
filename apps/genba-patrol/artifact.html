<title>物件巡回野帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style id="app-css">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
img{display:block;max-width:100%}

:root{
  --ground:#EDEAE3;
  --grid:rgba(27,58,87,.05);
  --surface:#FBFAF6;
  --surface-2:#F2F0E9;
  --ink:#1A1815;
  --ink-2:#635E55;
  --ink-3:#948E83;
  --line:#DCD7CC;
  --line-strong:#C0B9AB;
  --accent:#1B3A57;
  --accent-soft:#DDE5EC;
  --accent-ink:#F7F9FA;
  --focus:#2C6C99;
  --ok:#3D7A46;    --ok-bg:#E4EDE2;
  --watch:#B07400; --watch-bg:#F6EDD6;
  --fix:#B0302A;   --fix-bg:#F7E3E1;
  --na:#7A756B;    --na-bg:#EAE7DF;
  --none:#A9A399;  --none-bg:#EEEBE4;
  --mark-on:#FFFFFF;
  --shadow:0 1px 0 rgba(26,24,21,.04), 0 2px 10px rgba(26,24,21,.05);
  --radius:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14120E;
    --grid:rgba(190,208,222,.045);
    --surface:#1D1A15;
    --surface-2:#242019;
    --ink:#EBE6DC;
    --ink-2:#A99F90;
    --ink-3:#7E766A;
    --line:#2E2A22;
    --line-strong:#413C32;
    --accent:#7FB3D5;
    --accent-soft:#1C2A35;
    --accent-ink:#0D1216;
    --focus:#8FC6E5;
    --ok:#79C07F;    --ok-bg:#1B2A1D;
    --watch:#DFAE4D; --watch-bg:#2C2413;
    --fix:#E8837B;   --fix-bg:#2E1B1A;
    --na:#9A9284;    --na-bg:#232019;
    --none:#6E675C;  --none-bg:#201D17;
    --mark-on:#14120E;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#14120E;
  --grid:rgba(190,208,222,.045);
  --surface:#1D1A15;
  --surface-2:#242019;
  --ink:#EBE6DC;
  --ink-2:#A99F90;
  --ink-3:#7E766A;
  --line:#2E2A22;
  --line-strong:#413C32;
  --accent:#7FB3D5;
  --accent-soft:#1C2A35;
  --accent-ink:#0D1216;
  --focus:#8FC6E5;
  --ok:#79C07F;    --ok-bg:#1B2A1D;
  --watch:#DFAE4D; --watch-bg:#2C2413;
  --fix:#E8837B;   --fix-bg:#2E1B1A;
  --na:#9A9284;    --na-bg:#232019;
  --none:#6E675C;  --none-bg:#201D17;
  --mark-on:#14120E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.3);
}

body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;
  color:var(--ink);
  background-color:var(--ground);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  -webkit-text-size-adjust:100%;
  line-height:1.6;
  padding-bottom:104px;
}
.mono{font-family:"DM Mono","SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
.ud{font-family:"BIZ UDPGothic","Zen Kaku Gothic New",Meiryo,sans-serif}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;border-radius:2px;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 13px}

/* ---------- 物件バー ---------- */
.propbar{
  position:sticky;top:0;z-index:30;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:0 1px 8px rgba(26,24,21,.16);
}
.propbar-in{
  max-width:1120px;margin:0 auto;padding:7px 13px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.propsel{
  flex:1 1 180px;min-width:0;appearance:none;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.35);
  color:var(--accent-ink);font-family:"BIZ UDPGothic","Zen Kaku Gothic New",sans-serif;
  font-weight:700;font-size:clamp(15px,3.6vw,18px);padding:2px 20px 3px 2px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 9px) center,calc(100% - 5px) center;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.propsel option{color:#1A1815;background:#FBFAF6}
.propmeta{font-size:11.5px;opacity:.82;white-space:nowrap}
.propmeta b{font-weight:500}
@media (max-width:700px){.propmeta{display:none}}
.iconbtn{
  color:var(--accent-ink);border:1px solid rgba(255,255,255,.32);border-radius:999px;
  padding:3px 10px;font-size:12px;white-space:nowrap;
}
.iconbtn:hover{background:rgba(255,255,255,.12)}

/* ---------- 巡回票 ---------- */
.sheet{
  background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);
  box-shadow:var(--shadow);margin:13px 0 10px;
}
.meta-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.meta-cell{padding:7px 12px 8px;border-right:1px solid var(--line);min-width:0}
.meta-cell:last-child{border-right:none}
.meta-k{font-size:10.5px;letter-spacing:.13em;color:var(--ink-3);display:block}
.meta-v{
  font-size:15px;font-weight:500;background:none;border:1px dashed transparent;
  border-radius:2px;width:100%;padding:0 2px;margin-left:-2px;
}
.meta-v:hover{border-color:var(--line-strong)}
input[type="date"].meta-v{font-size:12.5px;letter-spacing:-.02em}
.meta-v.tight{font-size:12.5px;white-space:nowrap;letter-spacing:-.01em}
select.meta-v{
  appearance:none;cursor:pointer;padding-right:18px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 9px) calc(50% + 1px),calc(100% - 5px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.ledger{border-top:1px solid var(--line);padding:10px 12px 12px}
.bar{display:flex;height:8px;border-radius:1px;overflow:hidden;background:var(--none-bg);border:1px solid var(--line)}
.bar span{display:block;transition:width .28s ease}
.bar .b-ok{background:var(--ok)} .bar .b-watch{background:var(--watch)}
.bar .b-fix{background:var(--fix)} .bar .b-na{background:var(--na)}
.counts{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;align-items:baseline}
.count{display:inline-flex;align-items:baseline;gap:5px;font-size:12.5px;color:var(--ink-2)}
.count b{font-size:17px;font-weight:500;color:var(--ink)}
.count i{width:9px;height:9px;border-radius:1px;display:inline-block}
.count.ok i{background:var(--ok)} .count.watch i{background:var(--watch)}
.count.fix i{background:var(--fix)} .count.na i{background:var(--na)}
.count.none i{background:var(--none)}
.count.done{margin-left:auto}
.sheet-foot{
  border-top:1px dotted var(--line);padding:5px 12px 7px;font-size:11.5px;color:var(--ink-3);
  display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;
}

/* ---------- 一括・申し送り ---------- */
.sweep{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--ok-bg);border:1px solid var(--ok);border-radius:var(--radius);
  padding:9px 12px;margin:0 0 11px;
}
.sweep p{margin:0;font-size:12.5px;color:var(--ink-2);flex:1 1 180px}
.sweep b{color:var(--ok);font-weight:700}
.sweep button{
  background:var(--ok);color:var(--mark-on);border-radius:var(--radius);
  padding:9px 15px;font-size:13.5px;font-weight:700;white-space:nowrap;flex:0 0 auto;
}
@media (max-width:480px){.sweep button{flex:1 1 100%}}
.sweep button:hover{opacity:.88}

.carry{
  background:var(--watch-bg);border:1px solid var(--watch);border-left-width:4px;
  border-radius:var(--radius);padding:9px 12px 10px;margin:0 0 11px;
}
.carry h2{
  font-family:"BIZ UDPGothic",sans-serif;font-size:13px;margin:0 0 6px;
  color:var(--watch);letter-spacing:.02em;
}
.carry ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.carry li{font-size:13px;line-height:1.45}
.carry button{text-align:left;width:100%;display:flex;gap:7px;align-items:baseline}
.carry .cm{flex:0 0 auto;font-weight:700;font-size:12px;color:var(--watch)}
.carry .ct{flex:1 1 auto;min-width:0;border-bottom:1px dotted var(--line-strong)}
.carry .cd{flex:0 0 auto;font-size:11px;color:var(--ink-3)}
.carry .cmemo{display:block;font-size:11.5px;line-height:1.55;color:var(--ink-2);margin:1px 0 3px 26px;padding-left:8px;border-left:2px solid var(--line-strong)}

/* ---------- フィルタ ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:1px 0 10px;scrollbar-width:thin}
.filters button{
  white-space:nowrap;border:1px solid var(--line);background:var(--surface);
  padding:6px 13px;border-radius:999px;font-size:13px;color:var(--ink-2);
}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}

/* ---------- 分類 ---------- */
.cat{margin:0 0 20px;scroll-margin-top:56px;max-width:820px}
.cat-head{display:flex;align-items:baseline;gap:9px;padding:0 0 6px;border-bottom:2px solid var(--accent);margin-bottom:9px}
.cat-head h3{font-family:"BIZ UDPGothic",sans-serif;font-weight:700;font-size:14.5px;margin:0;letter-spacing:.02em}
.cat-head .n{font-size:11.5px;color:var(--ink-3)}

/* ---------- 点検カード ---------- */
.chk{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--none);
  margin-bottom:7px;box-shadow:var(--shadow);scroll-margin-top:60px;
}
.chk[data-s="ok"]{border-left-color:var(--ok)}
.chk[data-s="watch"]{border-left-color:var(--watch)}
.chk[data-s="fix"]{border-left-color:var(--fix)}
.chk[data-s="na"]{border-left-color:var(--na);opacity:.68}
.chk.hit{animation:flash 1.5s ease}
@keyframes flash{0%,100%{background:var(--surface)}22%{background:var(--watch-bg)}}
.chk-name{
  display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  padding:9px 11px 7px;font-size:14.5px;font-weight:500;line-height:1.4;cursor:default;
}
.chk-name .t{flex:1 1 auto;min-width:0}
.chk-name .prev{flex:0 0 auto;font-size:11px;color:var(--ink-3);white-space:nowrap}
.chk-name .prev b{font-weight:700}
.chk-name .prev.watch b{color:var(--watch)} .chk-name .prev.fix b{color:var(--fix)}
.chk-del{flex:0 0 auto;color:var(--ink-3);font-size:11.5px;padding:1px 3px}
.chk-del:hover{color:var(--fix)}

.marks{display:grid;grid-template-columns:1fr 1fr 1fr 52px;gap:5px;padding:0 11px 9px;max-width:452px}
.mk{
  --c:var(--ink-2);--bg:var(--surface-2);--bd:var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  min-height:50px;padding:5px 2px;border:1px solid var(--bd);border-radius:var(--radius);
  background:var(--bg);color:var(--c);line-height:1.15;
}
.mk .g{font-size:19px;font-weight:400}
.mk .l{font-size:10.5px;letter-spacing:.02em}
.mk:hover{--bd:var(--line-strong)}
.mk[aria-pressed="true"]{--c:var(--mark-on);font-weight:700}
.mk[aria-pressed="true"] .g{font-weight:700}
.mk-ok[aria-pressed="true"]{--bg:var(--ok);--bd:var(--ok)}
.mk-watch[aria-pressed="true"]{--bg:var(--watch);--bd:var(--watch)}
.mk-fix[aria-pressed="true"]{--bg:var(--fix);--bd:var(--fix)}
.mk-na[aria-pressed="true"]{--bg:var(--na);--bd:var(--na)}
.mk-na .g{font-size:16px}

.detail{padding:9px 11px 10px;display:flex;flex-direction:column;gap:8px;border-top:1px dotted var(--line);margin-top:-2px}
.detail[hidden]{display:none}
.carried-note{
  font-size:12px;color:var(--ink-2);background:var(--watch-bg);
  border-left:3px solid var(--watch);padding:5px 9px;border-radius:2px;
}
.carried-note b{color:var(--watch)}
.memo{
  width:100%;height:38px;resize:none;overflow:hidden;padding:7px 9px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  font-size:13.5px;line-height:1.5;
}
.memo::placeholder{color:var(--ink-3)}
.memo:focus{background:var(--surface)}
.shots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.shot{position:relative;width:62px;height:62px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--surface-2);padding:0}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .cap{
  position:absolute;left:0;right:0;bottom:0;background:rgba(20,18,14,.72);color:#fff;
  font-size:9px;line-height:1.3;padding:1px 3px;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.addshot{
  width:62px;height:62px;border:1px dashed var(--line-strong);border-radius:2px;
  display:grid;place-items:center;color:var(--ink-2);font-size:10.5px;background:var(--surface-2);
}
.addshot svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5}
.addshot:hover{border-color:var(--accent);color:var(--accent)}
.fixrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fixrow .lb{font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
.st{
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;
  background:var(--surface-2);color:var(--ink-2);
}
.st[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.stamp{font-size:11px;color:var(--ink-3)}

/* ---------- 追加項目 ---------- */
.addlink{font-size:12px;color:var(--ink-3);padding:3px 2px}
.addlink:hover{color:var(--accent)}
.addrow{display:flex;gap:6px;margin-top:2px}
.addrow[hidden]{display:none}
.addrow input{flex:1 1 auto;min-width:0;padding:7px 10px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);font-size:13.5px}
.addrow button{flex:0 0 auto;padding:7px 14px;border:1px solid var(--accent);color:var(--accent);border-radius:var(--radius);font-size:13px;font-weight:500;background:var(--surface)}
.addrow button:hover{background:var(--accent);color:var(--accent-ink)}

/* ---------- ドック ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line-strong);box-shadow:0 -2px 14px rgba(26,24,21,.1);
  padding:8px 13px calc(8px + env(safe-area-inset-bottom));
}
.dock-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dock-acts{display:contents}
@media (max-width:660px){
  .dock-in{display:grid;grid-template-columns:1fr auto;grid-template-areas:"sync gauge" "acts acts";gap:7px 10px}
  .sync{grid-area:sync}.gauge{grid-area:gauge}
  .dock-acts{grid-area:acts;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .dock-acts .btn{padding:9px 4px;text-align:center;font-size:12.5px}
}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);flex:1 1 190px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.dot.pending{background:var(--watch);animation:pulse 1.1s ease-in-out infinite}
.dot.error{background:var(--fix)}
.dot.local{background:var(--na)}
@keyframes pulse{50%{opacity:.32}}
.sync .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:8px 14px;border:1px solid var(--line-strong);border-radius:var(--radius);font-size:13px;font-weight:500;background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.88;color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.gauge{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.gauge .track{width:60px;height:5px;background:var(--none-bg);border:1px solid var(--line);border-radius:1px;overflow:hidden}
.gauge .fill{height:100%;background:var(--accent);transition:width .3s ease}
.gauge.warn .fill{background:var(--watch)} .gauge.full .fill{background:var(--fix)}

/* ---------- ダイアログ ---------- */
dialog{
  border:1px solid var(--line-strong);border-radius:var(--radius);padding:0;
  background:var(--surface);color:var(--ink);max-width:min(660px,94vw);width:100%;
  box-shadow:0 18px 60px rgba(0,0,0,.32);
}
dialog::backdrop{background:rgba(20,18,14,.62)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:15px;font-family:"BIZ UDPGothic",sans-serif;font-weight:700}
.dlg-body{padding:14px 15px;max-height:min(66vh,560px);overflow:auto}
.dlg-foot{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{font-size:20px;line-height:1;color:var(--ink-3);padding:2px 6px}
.x:hover{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11.5px;letter-spacing:.11em;color:var(--ink-3)}
.field input,.field textarea,.field select{padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);font-size:14px}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.65;margin:0 0 12px}
.tabs{display:flex;gap:5px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.rows li{border:1px solid var(--line);border-left:3px solid var(--accent);padding:8px 10px;background:var(--surface-2)}
.rows .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rows .rd{font-family:"DM Mono",monospace;font-size:13.5px;font-variant-numeric:tabular-nums}
.rows .rs{font-size:12px;color:var(--ink-2);display:flex;gap:9px;flex-wrap:wrap}
.rows .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rows .acts button{font-size:12px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:var(--radius)}
.logl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.logl li{display:flex;gap:9px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:12.5px;align-items:baseline}
.logl .lt{flex:0 0 auto;font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.logl .lw{flex:1 1 auto;min-width:0}
.logl .lb{flex:0 0 auto;font-size:11.5px;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:24px 6px;line-height:1.7}

#viewer{max-width:min(940px,96vw);background:#100E0B;border-color:#100E0B}
#viewer .dlg-head{border-color:#2A251D;color:#EBE6DC}
#viewer .dlg-head h3{color:#EBE6DC;font-size:13.5px;font-weight:400}
#viewer .dlg-body{padding:0;background:#100E0B;display:grid;place-items:center;max-height:64vh}
#viewer img{max-height:64vh;width:auto;object-fit:contain}
#viewer .dlg-foot{border-color:#2A251D;background:#100E0B;justify-content:space-between}
#viewer .x{color:#948E83}

  function compress(file) {

    if (!p) {
      html += '<div class="onboard"><h2>まず物件を登録してください</h2>' +
        '<p>アパート・戸建てなど、巡回する建物を登録すると点検表が作られます。' +
        '種別に合わせて項目が変わり（戸建てでは共用部の項目が出ません）、物件ごとに巡回記録と履歴が別々に残ります。</p>' +
        '<button class="btn primary" id="btnAddProp1">物件を登録する</button></div>';
    } else {
      html += sheetHTML(p);
      html += carryHTML();
      html += sweepHTML(p);
      html += filtersHTML(p);
      html += '<div id="list">' + listHTML(p) + '</div>';
    }
    html += '</div>';

    /* ドック */
    html += '<div class="dock"><div class="dock-in">';
    html += '<div class="sync"><span class="dot" id="syncDot"></span><span class="txt" id="syncTxt">読み込み中…</span></div>';
    html += '<div class="gauge" id="gauge"><span class="track"><span class="fill" id="gaugeFill" style="width:0%"></span></span><span class="mono" id="gaugeTxt">—</span></div>';
    html += '<div class="dock-acts">';
    html += '<button class="btn" id="btnHistory"' + (p ? "" : " disabled") + '>履歴</button>';
    html += '<button class="btn" id="btnExport"' + (p ? "" : " disabled") + '>書き出し</button>';
    html += '<button class="btn" id="btnFinish"' + (p && !readOnly ? "" : " disabled") + '>巡回を確定</button>';
    html += '<button class="btn primary" id="btnSaveNow" disabled>今すぐ保存</button>';
    html += '</div></div></div>';

    html += '<div class="toasts" id="toasts" aria-live="polite"></div>';
    html += dialogs();

    $("#app").innerHTML = html;
    bind();
    updateGauge();
    setSync(readOnly ? "local" : localOnly ? "local" : dirty ? "pending" : "ok",
      readOnly ? "閲覧のみ" : localOnly ? "この端末にのみ保存" : dirty ? "未保存の変更" : (probed ? "共有と同期済み" : "接続を確認中…"));
  }

  function sheetHTML(p) {
    var r = round(), c = tally(p, r);
    var h = '<section class="sheet"><div class="meta-row">';
    h += cell("巡回日", '<input class="meta-v mono" id="fDate" type="date" value="' + esc(r.date) + '"' + (readOnly ? " disabled" : "") + '>');
    h += cell("天候", '<select class="meta-v" id="fWeather"' + (readOnly ? " disabled" : "") + '>' +
      WEATHERS.map(function (w) { return '<option' + (w === r.weather ? " selected" : "") + '>' + esc(w) + '</option>'; }).join("") + '</select>');
    var lr0 = lastRound(p.id), dd = lr0 ? daysSince(lr0.date) : null;
    var sameYear = lr0 && String(lr0.date).slice(0, 4) === String(r.date).slice(0, 4);
    h += cell("前回巡回", '<span class="meta-v mono tight">' +
      (lr0 ? esc(sameYear ? fmtMD(lr0.date) : fmtDate(lr0.date)) + (dd != null ? "・" + dd + "日前" : "") : "記録なし") + '</span>');
    h += '</div>';

    h += '<div class="ledger"><div class="bar" role="img" aria-label="判定の内訳 異常なし' + c.ok + ' 要観察' + c.watch + ' 要修繕' + c.fix + ' 該当なし' + c.na + ' 未確認' + c.none + '">';
    ["ok", "watch", "fix", "na"].forEach(function (k) {
      h += '<span class="b-' + k + '" style="width:' + (c.total ? (c[k] / c.total) * 100 : 0) + '%"></span>';
    });
    h += '</div><div class="counts">';
    h += cnt("ok", "異常なし", c.ok) + cnt("watch", "要観察", c.watch) + cnt("fix", "要修繕", c.fix) +
      cnt("na", "該当なし", c.na) + cnt("none", "未確認", c.none);
    h += '<span class="count done">写真 <b class="mono">' + c.photos + '</b>枚</span>';
    h += '</div></div>';

    var last = S.log.length ? S.log[0] : null;
    h += '<div class="sheet-foot"><span>' +
      (p.address ? esc(p.address) : "「物件」から所在地・戸数を登録できます") + '</span>' +
      '<span class="mono">' + (last ? esc(fmtClock(last.at) + " " + (last.by || "") + " " + last.w).slice(0, 46) : "更新履歴なし") + '</span></div>';
    return h + '</section>';
  }
  function cell(k, v) { return '<div class="meta-cell"><span class="meta-k">' + esc(k) + '</span>' + v + '</div>'; }
  function cnt(k, l, n) { return '<span class="count ' + k + '"><i></i>' + esc(l) + ' <b class="mono">' + n + '</b></span>'; }

  function carryHTML() {
    var list = carriedList();
    if (!list.length) return "";
    var h = '<div class="carry"><h2>前回からの申し送り ' + list.length + '件</h2><ul>';
    list.forEach(function (x) {
      h += '<li><button data-jump="' + esc(x.it.id) + '">' +
        '<span class="cm">' + MARK_GLYPH[x.e.s] + '</span>' +
        '<span class="ct">' + esc(x.it.t) + '</span>' +
        '<span class="cd">' + esc(FIX_LABEL[x.e.st] || "未対応") + ' ' + esc(fmtMD(x.e.prevDate)) + '</span></button>';
      if (x.e.prevMemo) h += '<span class="cmemo">' + esc(x.e.prevMemo) + '</span>';
      h += '</li>';
    });
    return h + '</ul></div>';
  }

  function sweepHTML(p) {
    if (readOnly) return "";
    var c = tally(p, round());
    if (!c.none) return "";
    return '<div class="sweep"><p>ひと通り見て気になる所がなければ、<b>残り' + c.none + '項目</b>をまとめて「異常なし」にできます。</p>' +
      '<button id="btnSweep">残りを異常なしに</button></div>';
  }

  function filtersHTML(p) {
    var c = tally(p, round());
    var defs = [["all", "すべて", null], ["todo", "要対応", c.watch + c.fix], ["none", "未確認", c.none], ["photo", "写真あり", null]];
    var h = '<div class="filters" role="group" aria-label="表示の絞り込み">';
    defs.forEach(function (f) {
      h += '<button data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] +
        (f[2] != null ? ' <span class="mono">' + f[2] + '</span>' : "") + '</button>';
    });
    return h + '</div>';
  }

  function passes(it) {
    var e = peek(it.id);
    if (filter === "todo") return e.s === "watch" || e.s === "fix";
    if (filter === "none") return !e.s;
    if (filter === "photo") return (e.photos || []).length > 0;
    return true;
  }

  function listHTML(p) {
    var items = itemsFor(p), out = "", shown = 0;
    CATS.forEach(function (cat) {
      var mine = items.filter(function (i) { return i.c === cat.id; });
      if (!mine.length) return;
      var vis = mine.filter(passes);
      if (!vis.length && filter !== "all") return;
      shown += vis.length;
      out += '<section class="cat" id="cat-' + cat.id + '"><div class="cat-head"><h3>' + esc(cat.name) +
        '</h3><span class="n mono">' + vis.length + (filter === "all" ? "" : "/" + mine.length) + '項目</span></div>';
      vis.forEach(function (it) { out += cardHTML(it, p); });
      if (filter === "all" && !readOnly) {
        out += '<button class="addlink" data-addopen="' + cat.id + '">＋ ' + esc(cat.name) + 'に項目を追加</button>' +
          '<div class="addrow" data-addrow="' + cat.id + '" hidden><input type="text" data-addcat="' + cat.id +
          '" placeholder="この物件だけの点検項目" aria-label="' + esc(cat.name) + 'に項目を追加"><button data-addbtn="' + cat.id + '">追加</button></div>';
      }
      out += '</section>';
    });
    if (!shown) out = '<p class="empty">該当する項目はありません。</p>';
    return out;
  }

  function cardHTML(it, p) {
    var e = peek(it.id);
    var prev = prevOf(it.id, p);
    var h = '<article class="chk" id="chk-' + esc(it.id) + '" data-id="' + esc(it.id) + '" data-s="' + esc(e.s) + '">';
    h += '<div class="chk-name"><span class="t">' + esc(it.t) + '</span>';
    if (prev) h += '<span class="prev ' + esc(prev.s) + '">前回 <b>' + MARK_GLYPH[prev.s] + '</b> ' + esc(fmtMD(prev.date)) + '</span>';
    if (it.custom && !readOnly) h += '<button class="chk-del" data-del="' + esc(it.id) + '" title="この項目を削除">削除</button>';
    h += '</div>';

    h += '<div class="marks" role="group" aria-label="' + esc(it.t) + ' の判定">';
    MARKS.forEach(function (m) {
      h += '<button class="mk mk-' + m.k + '" data-set="' + esc(it.id) + '" data-m="' + m.k + '" aria-pressed="' + (e.s === m.k) + '"' + (readOnly ? " disabled" : "") + '>' +
        '<span class="g" aria-hidden="true">' + m.g + '</span>' +
        (m.k === "na" ? '<span class="sr">' + m.l + '</span>' : '<span class="l">' + m.l + '</span>') + '</button>';
    });
    h += '</div>';
    h += '<div class="detail"' + (showDetail(e) ? "" : " hidden") + ' data-detail="' + esc(it.id) + '">' + detailHTML(it, e) + '</div>';
    return h + '</article>';
  }

  function showDetail(e) {
    return e.s === "watch" || e.s === "fix" || !!e.memo || (e.photos || []).length > 0 || e.carried;
  }

  function detailHTML(it, e) {
    var h = "";
    if (e.carried && e.prevMemo) {
      h += '<div class="carried-note"><b>前回（' + esc(fmtMD(e.prevDate)) + '）</b> ' + esc(e.prevMemo) + '</div>';
    } else if (e.carried) {
      h += '<div class="carried-note"><b>前回（' + esc(fmtMD(e.prevDate)) + '）から持ち越し</b></div>';
    }
    h += '<textarea class="memo" data-memo="' + esc(it.id) + '" rows="1" placeholder="' +
      esc(it.h ? it.h : "どこが・どんな状態か（場所と程度を具体的に）") + '"' + (readOnly ? " disabled" : "") + '>' + esc(e.memo || "") + '</textarea>';
    h += '<div class="shots" data-shots="' + esc(it.id) + '">' + shotsHTML(it.id, e) + '</div>';
    if (e.s === "watch" || e.s === "fix") {
      h += '<div class="fixrow"><span class="lb">対応</span>';
      FIX_STATUS.forEach(function (f) {
        h += '<button class="st" data-st="' + esc(it.id) + '" data-v="' + f.k + '" aria-pressed="' + ((e.st || "open") === f.k) + '"' + (readOnly ? " disabled" : "") + '>' + f.l + '</button>';
      });
      h += '</div>';
    }
    h += '<div class="stamp" data-stamp="' + esc(it.id) + '">' + stampText(e) + '</div>';
    return h;
  }

  function stampText(e) {
    var bits = [];
    if (e.by) bits.push("記録 " + e.by);
    if (e.at) bits.push(fmtClock(e.at));
    if ((e.photos || []).length) bits.push("写真 " + e.photos.length + "枚");
    return esc(bits.join("　"));
  }

  function shotsHTML(id, e) {
    e = e || peek(id);
    var h = "";
    e.photos.forEach(function (ph, i) {
      h += '<button class="shot" data-view="' + esc(id) + '" data-i="' + i + '" title="' + esc(fmtClock(ph.at) + " " + (ph.by || "")) + '">' +
        '<img src="' + ph.src + '" alt="' + esc(ph.cap || ("写真 " + (i + 1))) + '">' +
        (ph.cap ? '<span class="cap">' + esc(ph.cap) + '</span>' : '<span class="cap mono">' + esc(fmtTime(ph.at)) + '</span>') +
        '</button>';
    });
    if (!readOnly) {
      h += '<button class="addshot" data-add="' + esc(id) + '" title="複数まとめて選べます">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.1-2h8.4l1.1 2h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>' +
        '<span class="sr">写真を追加</span></button>';
    }
    return h;
  }

  function prevOf(itemId, p) {
    var h = S.history[p.id] || [];
    for (var i = 0; i < h.length; i++) {
      var e = (h[i].entries || {})[itemId];
      if (e && e.s) return { s: e.s, date: h[i].date, memo: e.memo };
    }
    return null;
  }

  function syncCard(id) {
    var card = $('.chk[data-id="' + id + '"]');
    if (!card) return;
    var e = peek(id);
    card.dataset.s = e.s;
    $$(".mk", card).forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.m === e.s)); });
    var det = $('[data-detail="' + id + '"]', card);
    if (det) {
      var open = showDetail(e);
      det.hidden = !open;
      var hadFocus = det.contains(document.activeElement);
      if (open && !hadFocus) {
        var it = null;
        itemsFor(prop()).forEach(function (x) { if (x.id === id) it = x; });
        if (it) { det.innerHTML = detailHTML(it, e); $$(".memo", det).forEach(autosize); }
      } else if (open) {
        var shots = $('[data-shots="' + id + '"]', det);
        if (shots) shots.innerHTML = shotsHTML(id, e);
        var stamp = $('[data-stamp="' + id + '"]', det);
        if (stamp) stamp.innerHTML = stampText(e);
      }
    }
    refreshLedger();
  }

  function refreshLedger() {
    var p = prop();
    if (!p) return;
    var c = tally(p, round());
    var bar = $(".bar");
    if (bar) ["ok", "watch", "fix", "na"].forEach(function (k) {
      var el = $(".b-" + k, bar);
      if (el) el.style.width = (c.total ? (c[k] / c.total) * 100 : 0) + "%";
    });
    var box = $(".counts");
    if (box) {
      box.innerHTML = cnt("ok", "異常なし", c.ok) + cnt("watch", "要観察", c.watch) + cnt("fix", "要修繕", c.fix) +
        cnt("na", "該当なし", c.na) + cnt("none", "未確認", c.none) +
        '<span class="count done">写真 <b class="mono">' + c.photos + '</b>枚</span>';
    }
    var tf = $('[data-filter="todo"] .mono'); if (tf) tf.textContent = c.watch + c.fix;
    var nf = $('[data-filter="none"] .mono'); if (nf) nf.textContent = c.none;
    var sw = $(".sweep");
    if (sw && !c.none) sw.remove();
  }

  function autosize(ta) { ta.style.height = "auto"; ta.style.height = Math.max(38, ta.scrollHeight) + "px"; }

  /* ============ ダイアログ ============ */
  function dialogs() {
    var h = "";

    h += '<dialog id="whoDlg"><form method="dialog"><div class="dlg-head"><h3>点検者の設定</h3><button class="x" value="cancel" aria-label="閉じる">×</button></div>' +
      '<div class="dlg-body"><p class="hint">この端末を使う人の名前です。判定・写真・更新ログの記録者として残ります。2人で同じリンクを開けば同じ野帳を共同で編集できます。</p>' +
      '<div class="field"><label for="whoName">氏名</label><input id="whoName" maxlength="16" placeholder="例：田中"></div></div>' +
      '<div class="dlg-foot"><button class="btn" value="cancel">キャンセル</button><button class="btn primary" id="whoSave" value="save">保存</button></div></form></dialog>';

    h += '<dialog id="propDlg"><div class="dlg-head"><h3>物件</h3><button class="x" data-close="propDlg" aria-label="閉じる">×</button></div>' +
      '<div class="dlg-body" id="propBody"></div>' +
      '<div class="dlg-foot"><button class="btn" data-close="propDlg">閉じる</button><button class="btn primary" id="btnAddProp">物件を追加</button></div></dialog>';

    h += '<dialog id="editDlg"><form method="dialog"><div class="dlg-head"><h3 id="editTitle">物件の登録</h3><button class="x" value="cancel" aria-label="閉じる">×</button></div>' +
      '<div class="dlg-body">' +
      '<div class="field"><label for="pName">物件名</label><input id="pName" maxlength="40" placeholder="例：さくら荘"></div>' +
      '<div class="field"><label for="pKind">種別</label><select id="pKind">' +
      KINDS.map(function (k) { return '<option value="' + k.k + '">' + k.l + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="field"><label for="pAddr">所在地</label><input id="pAddr" maxlength="80"></div>' +
      '<div class="field-2"><div class="field"><label for="pUnits">戸数</label><input id="pUnits" inputmode="numeric" maxlength="4"></div>' +
      '<div class="field"><label for="pBuilt">建築年</label><input id="pBuilt" inputmode="numeric" maxlength="6" placeholder="例：1998"></div></div>' +
      '<div class="field"><label for="pNote">メモ（鍵の場所・注意点など）</label><textarea id="pNote" rows="2"></textarea></div>' +
      '</div><div class="dlg-foot"><button class="btn" value="cancel">キャンセル</button><button class="btn primary" id="pSave" value="save">保存</button></div></form></dialog>';

    h += '<dialog id="histDlg"><div class="dlg-head"><h3>履歴</h3><button class="x" data-close="histDlg" aria-label="閉じる">×</button></div>' +
      '<div class="dlg-body"><div class="tabs"><button data-tab="rounds">巡回履歴</button><button data-tab="log">更新ログ</button></div><div id="histBody"></div></div>' +
      '<div class="dlg-foot"><button class="btn" data-close="histDlg">閉じる</button></div></dialog>';

    h += '<dialog id="expDlg"><div class="dlg-head"><h3>書き出し</h3><button class="x" data-close="expDlg" aria-label="閉じる">×</button></div>' +
      '<div class="dlg-body"><p class="hint">巡回記録を提出・保管用のファイルに書き出します。HTMLレポートには写真もそのまま入ります。CSVは1行＝1点検項目なので、そのまま表計算に貼れます。</p>' +
      '<div class="field"><label for="expTarget">対象の巡回</label><select id="expTarget"></select></div></div>' +
      '<div class="dlg-foot"><button class="btn" id="expCsv">CSV（表計算用）</button><button class="btn primary" id="expHtml">HTMLレポート</button></div></dialog>';

    h += '<dialog id="askDlg"><form method="dialog"><div class="dlg-head"><h3>確認</h3><button class="x" value="no" aria-label="閉じる">×</button></div>' +
      '<div class="dlg-body"><p class="hint" id="askMsg"></p></div>' +
      '<div class="dlg-foot"><button class="btn" value="no">キャンセル</button><button class="btn primary" value="yes" id="askYes">実行</button></div></form></dialog>';

    h += '<dialog id="viewer"><div class="dlg-head"><h3 id="viewTitle">写真</h3><button class="x" data-close="viewer" aria-label="閉じる">×</button></div>' +
      '<div class="dlg-body"><img id="viewImg" alt=""></div>' +
      '<div class="dlg-foot"><button class="btn" id="viewPrev">前</button>' +
      '<input id="viewCap" maxlength="40" placeholder="ひとことメモ（例：北面2階サッシ下）">' +
      '<button class="btn" id="viewNext">次</button>' +
      '<button class="btn" id="viewDel">削除</button>' +
      '<button class="btn primary" data-close="viewer">閉じる</button></div></dialog>';

    return h;
  }

  function openDlg(id) { var d = $("#" + id); if (d && !d.open) d.showModal(); }
  function closeDlg(id) { var d = $("#" + id); if (d && d.open) d.close(); }

  function ask(msg, okLabel) {
    var d = $("#askDlg");
    if (!d || !d.showModal) { try { return Promise.resolve(window.confirm(msg)); } catch (e) { return Promise.resolve(false); } }
    $("#askMsg").textContent = msg;
    $("#askYes").textContent = okLabel || "実行";
    return new Promise(function (resolve) {
      d.addEventListener("close", function handler() {
        d.removeEventListener("close", handler);
        resolve(d.returnValue === "yes");
      });
      d.showModal();
    });
  }

  function openProps() {
    var body = $("#propBody");
    if (!S.properties.length) {
      body.innerHTML = '<p class="empty">まだ物件がありません。<br>「物件を追加」から登録してください。</p>';
    } else {
      var h = '<ul class="rows">';
      S.properties.forEach(function (x) {
        var lr = lastRound(x.id), d = lr ? daysSince(lr.date) : null;
        var hn = (S.history[x.id] || []).length;
        h += '<li><div class="r1"><span class="rd">' + esc(x.name) + '</span>' +
          '<span class="rs"><span>' + esc(KIND_LABEL[x.kind]) + '</span>' +
          (x.units ? '<span>' + esc(x.units) + '戸</span>' : "") +
          (x.built ? '<span>' + esc(x.built) + '年</span>' : "") +
          '<span>巡回' + hn + '回</span></span></div>';
        if (x.address) h += '<div class="rs">' + esc(x.address) + '</div>';
        h += '<div class="rs">前回 ' + (lr ? esc(fmtDate(lr.date)) + (d != null ? "（" + d + "日前）" : "") : "記録なし") + '</div>';
        h += '<div class="acts"><button data-popen="' + esc(x.id) + '">この物件を開く</button>' +
          (readOnly ? "" : '<button data-pedit="' + esc(x.id) + '">編集</button><button data-pdel="' + esc(x.id) + '">削除</button>') +
          '</div></li>';
      });
      body.innerHTML = h + '</ul>';
    }
    openDlg("propDlg");
  }

  var editingId = null;
  function openEdit(id) {
    editingId = id || null;
    var x = null;
    if (id) S.properties.forEach(function (y) { if (y.id === id) x = y; });
    $("#editTitle").textContent = x ? "物件の編集" : "物件の登録";
    $("#pName").value = x ? x.name : "";
    $("#pKind").value = x ? x.kind : "apart";
    $("#pAddr").value = x ? (x.address || "") : "";
    $("#pUnits").value = x ? (x.units || "") : "";
    $("#pBuilt").value = x ? (x.built || "") : "";
    $("#pNote").value = x ? (x.note || "") : "";
    openDlg("editDlg");
  }

  function openHistory() {
    var p = prop();
    if (!p) return;
    $$("[data-tab]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.tab === histTab)); });
    var body = $("#histBody");
    if (histTab === "log") {
      if (!S.log.length) { body.innerHTML = '<p class="empty">まだ更新はありません。</p>'; }
      else {
        var lh = '<ul class="logl">';
        S.log.forEach(function (l) {
          lh += '<li><span class="lt">' + esc(fmtClock(l.at)) + '</span><span class="lw">' + esc(l.w) + '</span><span class="lb">' + esc(l.by || "") + '</span></li>';
        });
        body.innerHTML = lh + '</ul>';
      }
      return;
    }
    var hist = S.history[p.id] || [];
    if (!hist.length) {
      body.innerHTML = '<p class="empty">確定した巡回はまだありません。<br>ひと回りしたら「巡回を確定」を押すと、ここに残ります。</p>';
      return;
    }
    var h = '<ul class="rows">';
    hist.forEach(function (r) {

      var size = 0;
      try { size = new Blob([JSON.stringify(r)]).size; } catch (e) { size = 0; }
      h += '<li><div class="r1"><span class="rd">' + esc(fmtDate(r.date)) + '</span><span class="rs">' +
        '<span>要修繕 ' + c.fix + '</span><span>要観察 ' + c.watch + '</span><span>写真 ' + c.photos + '</span>' +

          '<button data-hdel="' + esc(r.id) + '">削除</button>') + '</div></li>';
    });
    body.innerHTML = h + '</ul>';
  }

  function inspectorsOf(r) {
    var seen = {}, out = [];
    Object.keys(r.entries || {}).forEach(function (k) {
      var by = r.entries[k].by;
      if (by && !seen[by]) { seen[by] = 1; out.push(by); }
    });
    return out.join("・");
  }

  function reportCSV(p, r) {
    var items = itemsFor(p);
    var rows = [["物件ID", "物件名", "種別", "巡回日", "天候", "分類", "点検項目", "判定", "対応状況", "所見", "持ち越し", "写真枚数", "記録者", "記録日時"]];
    CATS.forEach(function (cat) {
      items.filter(function (i) { return i.c === cat.id; }).forEach(function (it) {
        var e = (r.entries || {})[it.id] || { s: "", photos: [] };
        rows.push([p.id, p.name, KIND_LABEL[p.kind] || "", fmtDate(r.date), r.weather || "", cat.name, it.t,
          MARK_LABEL[e.s], (e.s === "watch" || e.s === "fix") ? (FIX_LABEL[e.st] || "未対応") : "",
          (e.memo || "").replace(/\r?\n/g, " "), e.carried ? "持ち越し" : "",
          String((e.photos || []).length), e.by || "", e.at ? fmtClock(e.at) : ""]);
      });
    });
    return "﻿" + rows.map(function (row) {
      return row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
  }

  function reportText(p, r) {
    var items = itemsFor(p);
    var out = "# " + p.name + " 巡回記録\n\n- 巡回日: " + fmtDate(r.date) + "\n- 天候: " + (r.weather || "—") +
      "\n- 点検者: " + (inspectorsOf(r) || "—") + "\n\n";
    CATS.forEach(function (cat) {
      var mine = items.filter(function (i) { return i.c === cat.id; });
      if (!mine.length) return;
      out += "## " + cat.name + "\n\n";
      mine.forEach(function (it) {
        var e = (r.entries || {})[it.id] || { s: "", photos: [] };
        out += "- [" + MARK_LABEL[e.s] + "] " + it.t +
          ((e.s === "watch" || e.s === "fix") ? "（" + (FIX_LABEL[e.st] || "未対応") + "）" : "") +
          (e.memo ? " / " + e.memo.replace(/\r?\n/g, " ") : "") +
          ((e.photos || []).length ? " / 写真" + e.photos.length + "枚" : "") +
          (e.by ? " (" + e.by + ")" : "") + "\n";
      });
      out += "\n";
    });
    return out + "※ 写真はHTMLレポートに収録されます。\n";
  }

  function safeName(s) { return String(s).replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 40); }

  function download(filename, data, fbName, fbData) {
    if (!downloadsApi) { toast("この画面ではファイルの書き出しが使えません。", true); return; }
    downloadsApi.save({ filename: filename, data: data }).then(function () { toast("書き出しました。"); })
      .catch(function (err) {
        var code = (err && err.code) || "unavailable";
        if (code === "declined") return;
        if (code === "extension_not_enabled" && fbName) {
          downloadsApi.save({ filename: fbName, data: fbData })
            .then(function () { toast("この端末ではHTMLを保存できないため、テキスト形式で書き出しました。"); })
            .catch(function () { toast("書き出せませんでした。", true); });
          return;
        }
        if (code === "too_large") { toast("ファイルが大きすぎます。写真の少ない巡回を選んでください。", true); return; }
        if (code === "rate_limited") { toast("少し待ってからもう一度お試しください。", true); return; }
        toast("書き出せませんでした。", true);
      });
  }

  /* ============ 操作 ============ */
  function setMark(id, m) {
    var e = entry(id);
    var before = e.s;
    e.s = (e.s === m) ? "" : m;
    e.by = ME ? ME.name : "";
    e.at = Date.now();
    if (e.s !== "watch" && e.s !== "fix") e.st = "open";
    if (before !== e.s) logAdd(itemName(id) + " → " + MARK_LABEL[e.s]);
    syncCard(id);
    markDirty();
  }

  function sweep() {
    var p = prop();
    if (!p) return;
    var n = 0;
    itemsFor(p).forEach(function (it) {
      var e = entry(it.id);
      if (!e.s) { e.s = "ok"; e.by = ME ? ME.name : ""; e.at = Date.now(); n++; }
    });
    if (!n) return;
    logAdd("残り" + n + "項目を異常なしに");
    markDirty();
    render();
    toast(n + "項目を「異常なし」にしました。");
  }

  function finishRound() {
    var p = prop();
    if (!p) return;
    var r = round(), c = tally(p, r);
    var gate = c.none > 0
      ? ask("未確認が " + c.none + " 項目あります。このまま巡回を確定しますか?", "確定する")
      : Promise.resolve(true);
    gate.then(function (yes) {
      if (!yes) return;
      prune();
      var snap = JSON.parse(JSON.stringify(r));
      if (!S.history[p.id]) S.history[p.id] = [];
      S.history[p.id].unshift(snap);
      if (S.history[p.id].length > 24) S.history[p.id].length = 24;
      S.rounds[p.id] = newRound(p, snap);
      var carried = Object.keys(S.rounds[p.id].entries).length;
      filter = "all";
      logAdd(fmtMD(snap.date) + " の巡回を確定" + (carried ? "（申し送り" + carried + "件）" : ""));
      markDirty();
      render();
      toast(carried
        ? "確定しました。未対応の" + carried + "件を次回へ引き継ぎます。"
        : "確定しました。新しい巡回を開始します。");
    });
  }

  /* ============ イベント ============ */
  function bind() {
    $$(".memo").forEach(autosize);

    var whoDlg = $("#whoDlg");
    whoDlg.addEventListener("close", function () {
      if (whoDlg.returnValue !== "save") return;
      var name = ($("#whoName").value || "").trim().slice(0, 16);
      if (!name) return;
      setMe(name);
      render();
    });

    var editDlg = $("#editDlg");
    editDlg.addEventListener("close", function () {
      if (editDlg.returnValue !== "save" || readOnly) return;
      var name = ($("#pName").value || "").trim();
      if (!name) { toast("物件名を入力してください。", true); return; }
      var data = {
        name: name, kind: $("#pKind").value, address: ($("#pAddr").value || "").trim(),
        units: ($("#pUnits").value || "").trim(), built: ($("#pBuilt").value || "").trim(),
        note: $("#pNote").value || ""
      };
      if (editingId) {
        S.properties.forEach(function (x) { if (x.id === editingId) { for (var k in data) x[k] = data[k]; } });
        logAdd("物件「" + name + "」を編集");
      } else {
        data.id = uid("p"); data.extra = [];
        S.properties.push(data);
        S.activeId = data.id;
        logAdd("物件「" + name + "」を登録");
      }
      editingId = null;
      markDirty();
      render();
      if ($("#propDlg").open) openProps();
    });

  }

  function bindOnce() {
    var app = $("#app");

    app.addEventListener("change", function (ev) {
      var t = ev.target;
      if (t.id === "propSel") {
        S.activeId = t.value;
        filter = "all";
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (readOnly) return;
      if (t.id === "fDate") { round().date = t.value; markDirty(); return; }
      if (t.id === "fWeather") { round().weather = t.value; markDirty(); return; }
    });

    app.addEventListener("click", function (ev) {
      var t = ev.target;

      var cl = t.closest("[data-close]");
      if (cl) { closeDlg(cl.dataset.close); return; }

      var fb = t.closest("[data-filter]");
      if (fb) {
        filter = fb.dataset.filter;
        $$("[data-filter]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.filter === filter)); });
        $("#list").innerHTML = listHTML(prop());
        $$(".memo").forEach(autosize);
        return;
      }

      var mk = t.closest("[data-set]");
      if (mk && !readOnly) { setMark(mk.dataset.set, mk.dataset.m); return; }

      var st = t.closest("[data-st]");
      if (st && !readOnly) {
        var e = entry(st.dataset.st);
        e.st = st.dataset.v;
        e.by = ME ? ME.name : e.by;
        e.at = Date.now();
        logAdd(itemName(st.dataset.st) + " の対応を「" + FIX_LABEL[e.st] + "」に");
        $$('[data-st="' + st.dataset.st + '"]').forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === e.st)); });
        var stamp = $('[data-stamp="' + st.dataset.st + '"]');
        if (stamp) stamp.innerHTML = stampText(e);
        markDirty();
        return;
      }

      var jump = t.closest("[data-jump]");
      if (jump) {
        var card = $("#chk-" + jump.dataset.jump);
        if (card) {
          card.scrollIntoView({ block: "center", behavior: "smooth" });
          card.classList.remove("hit");
          void card.offsetWidth;
          card.classList.add("hit");
        }
        return;
      }

      var add = t.closest("[data-add]");
      if (add) {
        var fid = add.dataset.add;
        var inp = document.createElement("input");
        inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
        inp.setAttribute("capture", "environment");
        inp.addEventListener("change", function () { addPhotos(fid, inp.files); });
        inp.click();
        return;
      }

      var vw = t.closest("[data-view]");
      if (vw) { openViewer(vw.dataset.view, Number(vw.dataset.i)); return; }

      var del = t.closest("[data-del]");
      if (del && !readOnly) {
        var did = del.dataset.del;
        ask("この点検項目を削除しますか?", "削除する").then(function (yes) {
          if (!yes) return;
          var p = prop();
          p.extra = (p.extra || []).filter(function (x) { return x.id !== did; });
          delete round().entries[did];
          logAdd("点検項目を削除");
          markDirty(); render();
        });
        return;
      }

      var ao = t.closest("[data-addopen]");
      if (ao) {
        var row = $('[data-addrow="' + ao.dataset.addopen + '"]');
        if (row) { row.hidden = false; ao.hidden = true; $("input", row).focus(); }
        return;
      }

      var ab = t.closest("[data-addbtn]");
      if (ab && !readOnly) {
        var cat = ab.dataset.addbtn;
        var f = $('[data-addcat="' + cat + '"]');
        var label = (f.value || "").trim();
        if (!label) { f.focus(); return; }
        var p2 = prop();
        if (!p2.extra) p2.extra = [];
        p2.extra.push({ id: uid("c"), c: cat, t: label, k: "both", custom: true });
        f.value = "";
        logAdd("点検項目「" + label + "」を追加");
        markDirty(); render();
        toast("項目を追加しました。以降の巡回にも出ます。");
        return;
      }

      if (t.closest("#btnSweep")) { sweep(); return; }
      if (t.closest("#btnWho")) { $("#whoName").value = ME ? ME.name : ""; openDlg("whoDlg"); return; }
      if (t.closest("#btnProps")) { openProps(); return; }
      if (t.closest("#btnAddProp") || t.closest("#btnAddProp1")) { closeDlg("propDlg"); openEdit(null); return; }
      if (t.closest("#btnHistory")) { openHistory(); openDlg("histDlg"); return; }
      if (t.closest("#btnExport")) { openExport(); return; }
      if (t.closest("#btnFinish")) { finishRound(); return; }
      if (t.closest("#btnSaveNow")) { commit(); return; }

      var tab = t.closest("[data-tab]");
      if (tab) { histTab = tab.dataset.tab; openHistory(); return; }

      var po = t.closest("[data-popen]");
      if (po) { S.activeId = po.dataset.popen; filter = "all"; closeDlg("propDlg"); render(); window.scrollTo(0, 0); return; }

      var pe = t.closest("[data-pedit]");
      if (pe) { openEdit(pe.dataset.pedit); return; }

      var pd = t.closest("[data-pdel]");
      if (pd && !readOnly) {
        var pid = pd.dataset.pdel, pname = "";
        S.properties.forEach(function (x) { if (x.id === pid) pname = x.name; });
        closeDlg("propDlg");
        ask("「" + pname + "」を削除しますか? 巡回記録と写真もすべて消えます。", "削除する").then(function (yes) {
          if (yes) {
            S.properties = S.properties.filter(function (x) { return x.id !== pid; });
            delete S.rounds[pid]; delete S.history[pid];
            if (S.activeId === pid) S.activeId = S.properties.length ? S.properties[0].id : "";
            logAdd("物件「" + pname + "」を削除");
            markDirty(); render();
          }
          if (S.properties.length) openProps();
        });
        return;
      }

      var hexp = t.closest("[data-hexp]");
      if (hexp) { closeDlg("histDlg"); openExport(); $("#expTarget").value = hexp.dataset.hexp; return; }

      var hph = t.closest("[data-hphoto]");
      if (hph && !readOnly) {
        var rid = hph.dataset.hphoto;
        closeDlg("histDlg");
        ask("この巡回の写真だけを削除して容量を空けますか? 判定と所見は残ります。", "写真を削除").then(function (yes) {
          if (yes) {
            var p3 = prop(), n = 0;
            (S.history[p3.id] || []).forEach(function (r) {
              if (r.id !== rid) return;
              Object.keys(r.entries || {}).forEach(function (k) {
                n += (r.entries[k].photos || []).length;
                r.entries[k].photos = [];
              });
            });
            logAdd("過去の巡回の写真" + n + "枚を削除");
            markDirty(); updateGauge();
            toast(n + "枚を削除しました。");
          }
          openHistory(); openDlg("histDlg");
        });
        return;
      }

      var hdel = t.closest("[data-hdel]");
      if (hdel && !readOnly) {
        var hid = hdel.dataset.hdel;
        closeDlg("histDlg");
        ask("この巡回の記録を削除しますか? 写真も一緒に消えます。", "削除する").then(function (yes) {
          if (yes) {
            var p4 = prop();
            S.history[p4.id] = (S.history[p4.id] || []).filter(function (r) { return r.id !== hid; });
            logAdd("過去の巡回記録を削除");
            markDirty();
          }
          openHistory(); openDlg("histDlg");
        });
        return;
      }

      if (t.closest("#viewPrev")) { stepViewer(-1); return; }
      if (t.closest("#viewNext")) { stepViewer(1); return; }
      if (t.closest("#viewDel") && viewer && !readOnly) {
        var e2 = entry(viewer.itemId);
        e2.photos.splice(viewer.index, 1);
        syncCard(viewer.itemId); updateGauge();
        logAdd(itemName(viewer.itemId) + " の写真を削除");
        markDirty();
        if (e2.photos.length) { viewer.index = Math.min(viewer.index, e2.photos.length - 1); showViewer(); }
        else { closeDlg("viewer"); viewer = null; }
        return;
      }

      if (t.closest("#expHtml")) {
        var p5 = prop(), r5 = roundById($("#expTarget").value);
        var base = safeName(p5.name) + "_巡回_" + (r5.date || "");
        download(base + ".html", reportHTML(p5, r5), base + ".md", reportText(p5, r5));
        closeDlg("expDlg");
        return;
      }
      if (t.closest("#expCsv")) {
        var p6 = prop(), r6 = roundById($("#expTarget").value);
        var b6 = safeName(p6.name) + "_巡回_" + (r6.date || "");
        var csv = reportCSV(p6, r6);
        download(b6 + ".csv", csv, b6 + ".txt", csv);
        closeDlg("expDlg");
        return;
      }
    });

    app.addEventListener("input", function (ev) {
      var t = ev.target;
      if (readOnly) return;
      if (t.matches("[data-memo]")) {
        var e = entry(t.dataset.memo);
        e.memo = t.value;
        e.by = ME ? ME.name : e.by;
        if (!e.at) e.at = Date.now();
        autosize(t);
        stashDraft(t.dataset.memo, t.value);
        markDirty();
        return;
      }
      if (t.id === "viewCap" && viewer) {
        var e3 = entry(viewer.itemId);
        if (e3.photos[viewer.index]) { e3.photos[viewer.index].cap = t.value; markDirty(); }
        return;
      }
    });

    app.addEventListener("blur", function (ev) {
      var t = ev.target;
      if (!t.matches || !t.matches("input, textarea, select")) return;
      var id = t.dataset.memo;
      if (id) {
        var stamp = $('[data-stamp="' + id + '"]');
        if (stamp) stamp.innerHTML = stampText(peek(id));
      }
      if (t.id === "viewCap" && viewer) syncCard(viewer.itemId);
      if (dirty) {
        if (publishTimer) clearTimeout(publishTimer);
        publishTimer = setTimeout(commit, 600);
      }
    }, true);
  }

  /* ---- 写真ビューア ---- */
  function openViewer(itemId, i) {
    viewer = { itemId: itemId, index: i };
    showViewer();
    openDlg("viewer");
  }
  function stepViewer(d) {
    if (!viewer) return;
    var ph = peek(viewer.itemId).photos;
    if (!ph.length) return;
    viewer.index = (viewer.index + d + ph.length) % ph.length;
    showViewer();
  }
  function showViewer() {
    if (!viewer) return;
    var e = peek(viewer.itemId);
    var p = e.photos[viewer.index];
    if (!p) { closeDlg("viewer"); viewer = null; return; }
    $("#viewImg").src = p.src;
    $("#viewTitle").textContent = itemName(viewer.itemId) + "　" + (viewer.index + 1) + "/" + e.photos.length +
      "　" + fmtClock(p.at) + (p.by ? " " + p.by : "");
    var cap = $("#viewCap");
    cap.value = p.cap || "";
    cap.disabled = readOnly;
    $("#viewDel").style.display = readOnly ? "none" : "";
    var multi = e.photos.length > 1;
    $("#viewPrev").style.display = multi ? "" : "none";
    $("#viewNext").style.display = multi ? "" : "none";
  }

  /* ---- 下書きの退避と復元 ---- */
  function stashDraft(id, val) {
    var p = prop();
    if (!p) return;
    var d = sess(SS_DRAFT) || {};
    d[p.id + "/" + id] = val;
    sess(SS_DRAFT, d);
  }
  function applyDrafts() {
    var d = sess(SS_DRAFT);
    if (!d) return false;
    var changed = false;
    Object.keys(d).forEach(function (key) {
      var parts = key.split("/");
      var pid = parts[0], iid = parts[1];
      var r = S.rounds[pid];
      if (!r) return;
      var e = r.entries[iid];
      if (!e) { e = { s: "", memo: "", photos: [], st: "open", carried: false, by: "", at: 0 }; r.entries[iid] = e; }
      if (d[key] !== e.memo) { e.memo = d[key]; changed = true; }
    });
    return changed;
  }

  function setMe(name) {
    var found = null;
    S.members.forEach(function (m) { if (m.name === name) found = m; });
    if (!found) {
      found = { id: uid("m"), name: name };
      if (S.members.length < 6) { S.members.push(found); logAdd("点検者「" + name + "」を登録"); markDirty(); }
    }
    ME = found;
    store(LS_ME, ME);
  }
  function promptName() {
    if (ME || readOnly) return;
    var f = $("#whoName");
    if (!f) return;
    f.value = "";
    openDlg("whoDlg");
  }

  /* ============ 起動 ============ */
  function boot() {
    S = loadState();
    ME = store(LS_ME) || null;

    bindOnce();
    render();

    if (applyDrafts()) {
      render();
      toast("入力中だった所見を復元しました。");
      markDirty();
    }

    var y = sess(SS_SCROLL);
    if (y != null) { window.scrollTo(0, y); sess(SS_SCROLL, null); }

    var seen = sess(SS_SEEN);
    if (S.updatedAt && seen && S.updatedAt > seen && (!ME || S.updatedBy !== ME.name)) {
      toast((S.updatedBy || "もう一人") + "さんの記録を反映しました。");
    }
    sess(SS_SEEN, S.updatedAt || 0);

    if (!window.claude || !window.claude.use) {
      probed = true; localOnly = true;
      var cached = store(LS_LOCAL);
      if (cached && cached.state && cached.state.v === 2 && cached.at > (S.updatedAt || 0)) { S = cached.state; render(); }
      setSync("local", "この端末にのみ保存");
      promptName();
      return;
    }

    window.claude.use("artifact").then(function (api) {
      probed = true;
      artifactApi = api;
      if (!api) { enterReadOnly(); return; }
      canPublish = true;
      setSync(dirty ? "pending" : "ok", dirty ? "未保存の変更" : "共有と同期済み");
      promptName();
      if (dirty) commit();
    }).catch(function () { probed = true; enterReadOnly(); });

    window.claude.use("downloads").then(function (api) { downloadsApi = api; }).catch(function () {});

    window.addEventListener("beforeunload", function () {
      if (dirty) { saveLocal(); sess(SS_SCROLL, window.scrollY); }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
